# Read by makepkg inside setup's build sandbox (bin/hyprchroma-setup,
# in_sandbox), which points XDG_CONFIG_HOME here: after /etc/makepkg.conf and
# its makepkg.conf.d, in place of the user's own makepkg.conf.
#
# No -debug package. Setup installs only the package itself, and splitting
# out debug symbols filled a Pear Desktop build with minutes of gdb output.
OPTIONS+=(!debug)
